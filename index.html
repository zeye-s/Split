<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Split</title>
    <link href = "style.css" rel = "stylesheet">
</head>
<body>
    <div id = "player1Screen" class = "screen">
        <canvas id = "player1Board" width = "775px" height = "550px"></canvas>
        <div id = "player1Controls">
            <div class = "up">
                <h1>W</h1>
            </div>
            <div class = "down">
                <h1>A</h1>
                <h1>S</h1>
                <h1>D</h1>
            </div>
            <div id = "player1Finish">
                <h1>Waiting for Player 2</h1>
            </div>
            
        </div>
    </div>
    <div id = "player2Screen" class = "screen">
        <canvas id = "player2Board" width = "775px" height = "550px"></canvas>
        <div id = "player2Controls">
            <div class = "up">
                <h1>↑</h1>
            </div>
            <div class = "down">
                <h1>←</h1>
                <h1>↓</h1>
                <h1>→</h1>
            </div>
            <div id = "player2Finish">
                <h1>Waiting for Player 1</h1>
            </div>
        </div>
    </div>
    <div id = "completeScreen">
        <h1 id = "congrats">Completed, Congrats!</h1>
        <button id = "reset">Restart</button>
        <button id = "next">Next Stage</button>
    </div>
    <div id = "stageSelection">
        <button id = "select0">0</button>
        <button id = "select1">1</button>
        <button id = "select2">2</button>
        <button id = "select3">3</button>
        <button id = "select4">4</button>
    </div>
    <script src = "script.js"></script>
</body>
</html>
